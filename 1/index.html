<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bsides Indore | DATA HACK</title>
    <style>
        /* CSS STYLES */
        :root {
            /* Cyberpunk Color Palette */
            --cyber-pink: #ff0099;
            --cyber-purple: #9900ff;
            --dark-bg: #11001a;
            --text-color: #f0f0f0;
            --neon-glow: 0 0 5px var(--cyber-pink), 0 0 15px var(--cyber-purple), 0 0 30px rgba(255, 0, 153, 0.4);
            --border-glow: 0 0 3px var(--cyber-pink);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Space Mono', monospace;
            background-color: var(--dark-bg);
            color: var(--text-color);
            overflow: hidden; /* Keep background static */
        }

        /* 1. Header/Navigation */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(17, 0, 26, 0.8); /* Semi-transparent background */
            border-bottom: 2px solid var(--cyber-purple);
            box-shadow: var(--border-glow);
            z-index: 10;
        }

        .nav-link {
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-color);
            margin: 0 20px;
            font-size: 1em;
            letter-spacing: 2px;
            padding: 5px 10px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            color: var(--cyber-pink);
            border: 1px dashed var(--cyber-pink);
            text-shadow: 0 0 5px var(--cyber-pink);
            transform: translateY(-2px);
        }

        /* 2. Particles Canvas (Background) */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 3. Main Content */
        .landing-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Glitch Effect on Logo */
        .logo {
            font-size: 5em;
            font-weight: bold;
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-bottom: 0.1em;
            color: var(--cyber-pink);
            text-shadow: var(--neon-glow);
            position: relative;
            animation: flicker 2s infinite alternate;
        }

        .subtitle {
            font-size: 1.6em;
            color: var(--cyber-purple);
            margin-bottom: 2em;
            text-shadow: 0 0 5px var(--cyber-purple);
            letter-spacing: 3px;
            font-weight: 700;
        }

        /* Status Block - Terminal Style */
        .status-block {
            background: rgba(255, 0, 153, 0.1); /* Pink transparency */
            border: 2px solid var(--cyber-purple);
            padding: 20px 40px;
            margin-bottom: 40px;
            border-radius: 5px;
            box-shadow: var(--neon-glow);
            transition: all 0.5s ease;
            width: fit-content;
            cursor: default;
        }

        .status-block:hover {
            border-color: var(--cyber-pink);
            box-shadow: 0 0 10px var(--cyber-pink);
        }

        .date-text {
            font-size: 1.3em;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .status-text {
            font-size: 2.2em;
            font-weight: bold;
            color: var(--cyber-pink);
            text-shadow: 0 0 5px var(--cyber-pink);
        }

        /* Call to Action Button - Hacked/Data Style */
        .cta-button {
            display: inline-block;
            padding: 18px 35px;
            font-size: 1.4em;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--dark-bg);
            background: var(--cyber-pink);
            border: none;
            border-radius: 3px;
            box-shadow: var(--neon-glow);
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .cta-button:hover {
            background: white;
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--cyber-pink), 0 0 50px rgba(255, 0, 153, 0.8);
            transform: scale(1.05);
        }

        /* Glitch Animation (used for logo) */
        @keyframes flicker {
            0% { opacity: 1; text-shadow: var(--neon-glow); }
            20% { opacity: 0.8; }
            40% { opacity: 1; text-shadow: var(--neon-glow); }
            50% { opacity: 0.9; text-shadow: none; }
            60% { opacity: 1; text-shadow: var(--neon-glow); }
            80% { opacity: 0.95; }
            100% { opacity: 1; text-shadow: var(--neon-glow); }
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .logo {
                font-size: 3em;
            }
            .subtitle {
                font-size: 1.2em;
            }
            .status-text {
                font-size: 1.5em;
            }
            .cta-button {
                padding: 12px 25px;
                font-size: 1.1em;
            }
            .header {
                padding: 10px;
            }
            .nav-link {
                margin: 0 10px;
                font-size: 0.8em;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <a href="#speakers" class="nav-link">// SPEAKERS //</a>
        <a href="#aboutus" class="nav-link">// ABOUT US //</a>
        <a href="#event" class="nav-link">// EVENT DATA //</a>
    </header>

    <canvas id="particle-canvas"></canvas>

    <div class="landing-container">
        <div>
            <div class="logo">Bsides Indore</div>
            <div class="subtitle">RUNNING PROTOCOL V.2.0: CYBER DEFENSE INITIATED</div>
        </div>

        <section class="status-block">
            <div class="date-text">[EXECUTION DATE]</div>
            <div class="status-text">Q4 2025 // ACCESS REQUIRED</div>
        </section>

        <a href="#register" class="cta-button" onclick="alert('REDIRECTING TO REGISTRATION PORTAL...')">
            >>> DOWNLOAD ACCESS KEY <<<
        </a>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const numParticles = 100;

        function setCanvasDimensions() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Particle Class (Updated to cyberpunk colors)
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                // Alternate between pink and purple
                this.color = (Math.random() > 0.5) ? 'rgba(255, 0, 153, 0.7)' : 'rgba(153, 0, 255, 0.7)';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Simple boundary reset
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                     this.x = Math.random() * canvas.width;
                     this.y = Math.random() * canvas.height;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            setCanvasDimensions();
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // Clear canvas with a very dark, slightly transparent color for trails
            ctx.fillStyle = 'rgba(17, 0, 26, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw and update particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            // Draw connections between nearby particles (the "network" effect)
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) { // Max distance for connection increased slightly
                        // Use a mix of pink and purple for the lines
                        const lineColor = (a % 2 === 0) ? 'rgba(255, 0, 153, ' : 'rgba(153, 0, 255, ';
                        ctx.strokeStyle = lineColor + `${1 - (distance / 120)})`; 
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        animate();
    </script>
</body>
</html>
