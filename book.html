            const post = posts.find(p => p.id === postId);

            if (!post) {
                mainContent.innerHTML = `<div class="text-center py-16"><h1 class="text-4xl text-white">Post not found!</h1></div>`;

            }

            const pageHtml = `

                    <div class="flex flex-wrap gap-2 mb-6">
                        ${post.tags.map(tag => `<span class="bg-gray-700 text-gray-300 text-sm font-semibold px-3 py-1 rounded-full">${tag}</span>`).join('')}

            `;

         */
        function getTeaser(text, maxLength = 200) {
            // Reverted back to a simple truncation without stripping HTML tags, for the preview on the home page.
            if (text.length <= maxLength) {
                return text;
            }
            return text.substring(0, maxLength) + '...';
        }

        // --- Event Listeners and Initial Setup ---
        
        /**
         * Attaches event listeners for the homepage elements after they've been rendered.
         */
        function setupHomepageListeners() {
            // Find the dynamically created elements
            const writeupsContainer = document.getElementById('writeups-container');
            const paginationContainer = document.getElementById('pagination-container');
            const customDropdown = document.getElementById('month-year-dropdown');
            const dropdownSelectedValue = document.getElementById('dropdown-selected-value');
            const dropdownList = document.getElementById('month-year-list');

            // Re-attach event listeners for the dropdown
            const dropdownButton = customDropdown.querySelector('[role="button"]');
            const dropdownArrow = dropdownButton.querySelector('svg');
            dropdownButton.addEventListener('click', (event) => {
                customDropdown.classList.toggle('active');
                const isExpanded = customDropdown.classList.contains('active');
                dropdownButton.setAttribute('aria-expanded', isExpanded);
                if (isExpanded) {
                    dropdownArrow.style.transform = 'rotate(180deg)';
                } else {
                    dropdownArrow.style.transform = 'rotate(0deg)';
                }
                event.stopPropagation();
            });
            dropdownList.addEventListener('click', (e) => {
                const selectedOption = e.target.closest('li');
                if (selectedOption) {
                    const selectedValue = selectedOption.dataset.value;
                    const selectedText = selectedOption.textContent;
                    dropdownSelectedValue.textContent = selectedText;
                    dropdownSelectedValue.dataset.value = selectedValue;
                    customDropdown.classList.remove('active');
                    dropdownButton.setAttribute('aria-expanded', 'false');
                    dropdownArrow.style.transform = 'rotate(0deg)';
                    renderWriteups(1, selectedValue);
                }
            });
            document.addEventListener('click', (e) => {
                if (!customDropdown.contains(e.target)) {
                    customDropdown.classList.remove('active');
                    dropdownButton.setAttribute('aria-expanded', 'false');
                    dropdownArrow.style.transform = 'rotate(0deg)';
                }
            });
            
            // Attach event listener to the writeup container for delegation
            writeupsContainer.addEventListener('click', (event) => {
                const articleLink = event.target.closest('.writeup-link');
                if (articleLink) {
                    event.preventDefault(); // Prevent default link behavior
                    const postId = articleLink.dataset.postId;
                    renderSinglePost(postId);
                }
            });
        }

        // --- Core Rendering Functions ---

        /**
         * Renders the writeup articles for the specified page and filter.
         * @param {number} page The page number to display.
         * @param {string} filterMonthYear The month and year to filter by (e.g., "JAN 2025").
         */
        function renderWriteups(page, filterMonthYear = 'All') {
            currentPage = page;
            const writeupsContainer = document.getElementById('writeups-container');
            writeupsContainer.innerHTML = '';
            
            let writeups = posts.filter(post => post.type === 'writeup');
            
            if (filterMonthYear !== 'All') {
                writeups = writeups.filter(post => {
                    const dateParts = post.date.split(' ');
                    const month = dateParts[0].substring(0, 3).toUpperCase();
                    const year = dateParts[2];
                    const postMonthYear = `${month} ${year}`;
                    return postMonthYear === filterMonthYear;
                });
            }
            
            const startIndex = (page - 1) * postsPerPage;
            const endIndex = startIndex + postsPerPage;
            const paginatedWriteups = writeups.slice(startIndex, endIndex);

            paginatedWriteups.forEach(post => {
                const article = document.createElement('a');
                article.href = "#"; // Using '#' to prevent navigation, as rendering is now dynamic
                article.dataset.postId = post.id;
                article.className = 'writeup-link block bg-gray-800 p-6 rounded-lg shadow-md transition-transform transform hover:scale-[1.01] hover:shadow-xl';
                article.innerHTML = `
                    <div class="flex items-center space-x-4 mb-4">
                        <span class="bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-full">Writeup</span>
                        <h3 class="text-2xl font-bold text-indigo-400">${post.title}</h3>
                    </div>
                    <p class="text-gray-400 text-sm mb-4">By ${post.author} on ${post.date}</p>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${post.tags.map(tag => `<span class="bg-gray-700 text-gray-300 text-xs font-semibold px-2 py-1 rounded-full">${tag}</span>`).join('')}
                    </div>
                    <!-- Display only a teaser of the content on the home page -->
                    <p class="text-gray-300">${getTeaser(post.content)}</p>
                `;
                writeupsContainer.appendChild(article);
            });
            renderPagination(writeups);
        }

        /**
         * Renders the pagination controls below the writeups section.
         * @param {Array} filteredWriteups The array of writeups currently being displayed.
         */
        function renderPagination(filteredWriteups) {
            const paginationContainer = document.getElementById('pagination-container');
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredWriteups.length / postsPerPage);

            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    const button = document.createElement('button');
                    button.textContent = i;
                    button.className = `px-4 py-2 rounded-lg font-bold transition-colors duration-200`;
                    
                    if (i === currentPage) {
                        button.classList.add('bg-indigo-500', 'text-white');
                    } else {
                        button.classList.add('bg-gray-700', 'text-gray-300', 'hover:bg-indigo-400', 'hover:text-white');
                    }

                    button.addEventListener('click', () => {
                        const dropdownSelectedValue = document.getElementById('dropdown-selected-value');
                        renderWriteups(i, dropdownSelectedValue.dataset.value);
                    });
                    paginationContainer.appendChild(button);
                }
            }
        }

        /**
         * Populates the custom dropdown with unique month/year values.
         */
        function populateDropdown() {
            const writeups = posts.filter(post => post.type === 'writeup');
            const uniqueDates = [...new Set(writeups.map(post => {
                const dateParts = post.date.split(' ');
                const month = dateParts[0].substring(0, 3).toUpperCase();
                const year = dateParts[2];
                return `${month} ${year}`;
            }))];
            
            uniqueDates.sort((a, b) => {
                const dateA = new Date(a.replace(' ', ' 1, '));
                const dateB = new Date(b.replace(' ', ' 1, '));
                return dateB - dateA;
            });
            
            const dropdownList = document.getElementById('month-year-list');
            if (dropdownList) {
                dropdownList.innerHTML = '';
                
                const allDatesOption = document.createElement('li');
                allDatesOption.textContent = 'All Dates';
                allDatesOption.dataset.value = 'All';
                allDatesOption.className = 'px-4 py-2 hover:bg-gray-700 cursor-pointer transition-colors duration-200 rounded-md whitespace-nowrap';
                dropdownList.appendChild(allDatesOption);
                
                uniqueDates.forEach(date => {
                    const option = document.createElement('li');
                    option.textContent = date;
                    option.dataset.value = date;
                    option.className = 'px-4 py-2 hover:bg-gray-700 cursor-pointer transition-colors duration-200 rounded-md whitespace-nowrap';
                    dropdownList.appendChild(option);
                });
            }
        }

        /**
         * Renders the content for the sidebar sections (CTFs and Conferences).
         */
        function renderSidebarContent() {
            const ctfsContainer = document.getElementById('ctfs-container');
            const conferencesContainer = document.getElementById('conferences-container');
            if (ctfsContainer && conferencesContainer) {
                ctfsContainer.innerHTML = '';
                conferencesContainer.innerHTML = '';

                posts.filter(post => post.type === 'ctf').forEach(post => {
                    const listItem = document.createElement('li');
                    listItem.className = 'bg-gray-800 p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow';
                    listItem.innerHTML = `
                        <a href="${post.link}" class="flex items-start space-x-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-swords text-yellow-400 mt-1">
                                <path d="M14.5 17.5 12 15l-1.5 1.5 2 2 1.5-1.5z"/><path d="M2.5 14.5 5 12l1.5 1.5-2 2-1.5-1.5z"/><path d="M12 2l-1.5 1.5 2 2 1.5-1.5L12 2z"/><path d="M15.5 12.5 18 15l1.5-1.5-2-2-1.5 1.5z"/><path d="M9.5 9.5 12 12l1.5-1.5-2-2-1.5 1.5z"/><path d="M12 15l-1.5-1.5-2-2-1.5 1.5L2.5 14.5z"/><path d="M18 15l1.5 1.5-2 2-1.5-1.5z"/><path d="M5 12l-1.5-1.5-2-2-1.5 1.5L2.5 14.5z"/>
                            </svg>
                            <div>
                                <span class="block text-xl font-bold text-yellow-400">${post.title}</span>
                                <p class="text-gray-300 text-sm mt-1">Date: ${post.date}</p>
                            </div>
                        </a>
                    `;
                    ctfsContainer.appendChild(listItem);
                });

                posts.filter(post => post.type === 'conference').forEach(post => {
                    const listItem = document.createElement('li');
                    listItem.className = 'bg-gray-800 p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow';
                    listItem.innerHTML = `
                        <a href="${post.link}" class="flex items-start space-x-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar text-emerald-400 mt-1">
                                <path d="M8 2v4"/><path d="M16 2v4"/><rect x="2" y="4" width="20" height="18" rx="2"/><path d="M3 10h18"/>
                            </svg>
                            <div>
                                <span class="block text-xl font-bold text-emerald-400">${post.title}</span>
                                <p class="text-gray-300 text-sm mt-1">Date: ${post.date}</p>
                            </div>
                        </a>
                    `;
                    conferencesContainer.appendChild(listItem);
                });
            }
        }
        
        // --- Main Event Handlers and Initialization ---
        
        /**
         * Renders all dynamic content for the page, including writeups, sidebar, and dropdown.
         */
        function renderAllContent() {
            populateDropdown();
            renderWriteups(1, 'All');
            renderSidebarContent();
        }
        
        // --- Mobile Menu Toggle ---
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // --- Initial Page Load Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            renderHomePage();
        });
        
        // Handle home link click
        homeLink.addEventListener('click', (event) => {
            event.preventDefault();
            renderHomePage();
        });
    </script>
</body>
</html>
